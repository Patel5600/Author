services:
  - type: web
    name: author-relay
    runtime: go
    plan: free
    region: oregon
    buildCommand: go build -ldflags="-s -w" -o relay ./cmd/relay
    startCommand: ./relay
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_PATH
        value: ./data/author.db
      - key: STATIC_DIR
        value: ./web

  - type: cron
    name: author-keepalive-cron
    runtime: go
    plan: free
    region: oregon
    schedule: "*/14 * * * *"
    buildCommand: go build -ldflags="-s -w" -o ping ./cmd/ping
    startCommand: ./ping
    envVars:
      - key: PING_URL
        value: https://author-relay.onrender.com/health
